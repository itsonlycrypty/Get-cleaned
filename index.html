<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Cleaned</title>
    <style>
        body {
            background-color: #0A1931; /* Dark Blue */
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .app-container {
            width: 90%;
            max-width: 400px;
            background-color: #11284B;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .logo { font-size: 28px; font-weight: bold; color: #00B4D8; margin-bottom: 5px; }
        .creator { font-size: 12px; color: #90E0EF; margin-bottom: 30px; }
        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: conic-gradient(#00B4D8 0%, #11284B 0%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inner-circle {
            width: 170px;
            height: 170px;
            background-color: #0A1931;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .ram-text { font-size: 32px; font-weight: bold; color: #00B4D8; }
        .ram-label { font-size: 14px; color: #CAF0F8; }
        .btn {
            background-color: #00B4D8;
            color: #0A1931;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 80%;
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); background-color: #90E0EF; }
        .status { margin-top: 20px; font-size: 14px; color: #90E0EF; min-height: 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="logo">Get Cleaned</div>
        <div class="creator">by C @anonymous vael</div>
        
        <div class="circle-container" id="circle">
            <div class="inner-circle">
                <div class="ram-text" id="ramValue">0 MB</div>
                <div class="ram-label">RAM Cleaned</div>
            </div>
        </div>

        <button class="btn" id="boostBtn" onclick="startBoost()">BOOST NOW</button>
        <div class="status" id="statusText">Ready to scan</div>
    </div>

    <script>
        function startBoost() {
            const btn = document.getElementById('boostBtn');
            const status = document.getElementById('statusText');
            const ramText = document.getElementById('ramValue');
            const circle = document.getElementById('circle');
            
            btn.disabled = true;
            btn.innerText = "SCANNING...";
            status.innerText = "Killing background apps...";
            
            let progress = 0;
            let cleanedRam = 0;
            
            const interval = setInterval(() => {
                progress += 5;
                cleanedRam += 15;
                circle.style.background = `conic-gradient(#00B4D8 ${progress}%, #11284B ${progress}%)`;
                ramText.innerText = `${cleanedRam} MB`;
                
                if (progress >= 100) {
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.innerText = "CLEAN AGAIN";
                    status.innerText = "Device is running smoothly!";
                }
            }, 50);
        }
    </script>
</body>
</html>
